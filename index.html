    // 3. DATOS DE TU CONEXIÓN HIVEMQ CLOUD (Reemplazá acá con tus datos reales)
    const broker = "d7c00be048ac4f408cd656bbb25ac141.s1.eu.hivemq.cloud"; 
    const usuario = "COLEGIO750";                                     
    const contrasena = "Presente26";                    
    const topico = "colegio/asistencia/unica";             
    const puerto = 8884; 
    // =================================================================

    const client = new Paho.MQTT.Client(broker, Number(puerto), "web_" + Math.random().toString(16).substr(2, 8));
    const selectCurso = document.getElementById("curso");
    const selectEstudiante = document.getElementById("estudiante");
    const btn = document.getElementById("btnEnviar");
    const statusDiv = document.getElementById("status");

    // OBTENER LA FECHA DE HOY (Formato AAAA-MM-DD)
    function obtenerFechaHoy() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // CONTROL DE DISPOSITIVO: Bloquear de entrada si ya firmó hoy
    window.onload = function() {
        const asistenciaHoy = localStorage.getItem("asistencia_enviada_dia");
        if (asistenciaHoy === obtenerFechaHoy()) {
            bloquearFormularioPorFraude();
        }
    };

    function bloquearFormularioPorFraude() {
        selectCurso.disabled = true;
        selectEstudiante.disabled = true;
        document.getElementById("estado").disabled = true;
        btn.disabled = true;
        btn.innerText = "Envío Deshabilitado";
        statusDiv.style.display = "block";
        statusDiv.style.background = "#fee2e2";
        statusDiv.style.color = "#dc2626";
        statusDiv.innerText = "Bloqueo de Seguridad: Desde este dispositivo ya se registró una asistencia el día de hoy.";
    }

    // Lógica en cascada de estudiantes
    selectCurso.onchange = function() {
        const cursoSeleccionado = selectCurso.value;
        const alumnos = baseDatosCursos[cursoSeleccionado] || [];
        selectEstudiante.innerHTML = '<option value="" disabled selected>Seleccioná tu nombre...</option>';
        alumnos.forEach((alumno, indice) => {
            let opt = document.createElement("option");
            opt.value = indice; 
            opt.innerText = alumno.nombre;
            selectEstudiante.appendChild(opt);
        });
        selectEstudiante.disabled = false;
        btn.disabled = false;
    };

    // Fórmula Haversine matemática para medir distancias
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const phi1 = lat1 * Math.PI/180;
        const phi2 = lat2 * Math.PI/180;
        const deltaPhi = (lat2-lat1) * Math.PI/180;
        const deltaLambda = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

document.getElementById("asistenciaForm").onsubmit = function(e) {
        e.preventDefault();
        
        if (localStorage.getItem("asistencia_enviada_dia") === obtenerFechaHoy()) {
            bloquearFormularioPorFraude();
            return;
        }

        btn.disabled = true;
        btn.innerText = "Calculando GPS...";
        statusDiv.style.display = "block";
        statusDiv.style.background = "#fef3c7";
        statusDiv.style.color = "#d97706";
        statusDiv.innerText = "Conectando con satélites... Esperando precisión óptima.";

        // Usamos watchPosition para forzar el refresco del hardware del GPS
        const watchId = navigator.geolocation.watchPosition(
            function(position) {
                const latAlumno = position.coords.latitude;
                const lonAlumno = position.coords.longitude;
                const precision = position.coords.accuracy; // Margen de error en metros
                
                const distancia = calcularDistancia(latAlumno, lonAlumno, ESCUELA_LAT, ESCUELA_LON);
                
                // Si la precisión es muy mala (mayor a 300m), esperamos al siguiente ciclo del chip
                if (precision > 300) {
                    statusDiv.innerText = `Ubicando... (Mejorando precisión actual: +/- ${Math.round(precision)}m)`;
                    return; 
                }

                // Si ya tenemos buena precisión, frenamos el rastreador y evaluamos la distancia
                navigator.geolocation.clearWatch(watchId);

                if (distancia <= DISTANCIA_MAXIMA_METROS) {
                    statusDiv.style.background = "#d1fae5";
                    statusDiv.style.color = "#065f46";
                    statusDiv.innerText = `Ubicación confirmada a ${Math.round(distancia)} metros. Transmitiendo...`;
                    conectarYEnviarMQTT();
                } else {
                    statusDiv.style.background = "#fee2e2";
                    statusDiv.style.color = "#dc2626";
                    statusDiv.innerText = `Acceso Denegado: Debés estar en el lugar configurado. Detectado a ${Math.round(distancia)} metros.`;
                    btn.disabled = false;
                    btn.innerText = "Reintentar Envío";
                }
            },
            function(error) {
                navigator.geolocation.clearWatch(watchId);
                statusDiv.style.background = "#fee2e2";
                statusDiv.style.color = "#dc2626";
                statusDiv.innerText = "Error obligatorio: Activa el GPS y concede permisos al navegador.";
                btn.disabled = false;
                btn.innerText = "Reintentar Envío";
            },
            { 
                enableHighAccuracy: true, // Fuerza el uso de satélites GPS
                timeout: 12000,           // Le damos 12 segundos de tiempo
                maximumAge: 0             // Prohibido usar ubicaciones viejas guardadas
            }
        );
    };

    function conectarYEnviarMQTT() {
        client.connect({
            userName: usuario,
            password: contrasena,
            useSSL: true,
            timeout: 7,
            onSuccess: onConnect,
            onFailure: function(err) {
                statusDiv.style.background = "#fee2e2";
                statusDiv.style.color = "#dc2626";
                statusDiv.innerText = "Error de red: " + (err.errorMessage || "Fallo de comunicación con el bróker.");
                btn.disabled = false;
                btn.innerText = "Reintentar";
            }
        });
    }

    function onConnect() {
        const curso = selectCurso.value;
        const indiceAlumno = selectEstudiante.value;
        const alumnoDatos = baseDatosCursos[curso][indiceAlumno];
        
        const nombre = alumnoDatos.nombre;
        const dni = alumnoDatos.dni || "-"; 
        const estado = document.getElementById("estado").value;
        const ahora = new Date().toLocaleString();

        const mensajeTexto = `${ahora}|${nombre} (${curso})|${dni}|${estado}`;
        
        const message = new Paho.MQTT.Message(mensajeTexto);
        message.destinationName = topico;
        message.qos = 1;
        
        try {
            client.send(message);
            
            // MARCA HISTÓRICA: Bloqueamos el dispositivo para el día de hoy
            localStorage.setItem("asistencia_enviada_dia", obtenerFechaHoy());
            
            // Reestablecer la interfaz antes de trabarla por completo
            document.getElementById("asistenciaForm").reset();
            selectEstudiante.innerHTML = '<option value="" disabled selected>Primero elegí el curso...</option>';
            
            // Bloqueo inmediato en pantalla
            bloquearFormularioPorFraude();
            statusDiv.innerText = "¡Asistencia registrada con éxito!\nDispositivo bloqueado hasta mañana.";
            statusDiv.style.background = "#ecfdf5";
            statusDiv.style.color = "#059669";
            
        } catch (error) {
            statusDiv.innerText = "Error al despachar el paquete.";
            statusDiv.style.color = "#dc2626";
            btn.disabled = false;
            btn.innerText = "Enviar Registro";
        } finally {
            client.disconnect();
        }
    }
