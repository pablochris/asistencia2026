        select, button { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; background: #f8fafc; }
        select:focus { outline: none; border-color: var(--primary); background: #fff; }
        button { background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 4px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { text-align: center; font-weight: 600; margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 6px; display: none; line-height: 1.4; white-space: pre-line; }

    function obtenerFechaHoy() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    window.onload = function() {
        if (localStorage.getItem("asistencia_enviada_dia") === obtenerFechaHoy()) {
            bloquearFormularioPorFraude();
        }
    };

    function bloquearFormularioPorFraude() {
        selectCurso.disabled = true;
        selectEstudiante.disabled = true;
        selectEstado.disabled = true;
        btn.disabled = true;
        btn.innerText = "Envío Deshabilitado";
        statusDiv.style.display = "block";
        statusDiv.style.background = "#fee2e2";

    }

        const alumnos = baseDatosCursos[cursoSeleccionado] || [];

            opt.innerText = alumno.nombre;
            selectEstudiante.appendChild(opt);
        });
        
        selectEstudiante.disabled = false;
        btn.disabled = false;
    };

        e.preventDefault();

            bloquearFormularioPorFraude();
            return;
        }

        btn.disabled = true;
        btn.innerText = "Transmitiendo...";
        conectarYEnviarMQTT();
    };

            password: contrasena,
            useSSL: true,
            timeout: 5,
            onSuccess: onConnect,
            onFailure: function(err) {

                statusDiv.style.color = "#dc2626";
                statusDiv.innerText = "Error de red: No se pudo conectar con el servidor.";
