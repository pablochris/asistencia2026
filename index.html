    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 340px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1e293b; margin: 0 0 20px 0; font-weight: 700; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #64748b; font-weight: 600; }
        select, button { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; background: #f8fafc; }
        select:focus { outline: none; border-color: var(--primary); background: #fff; }
        button { background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 4px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { text-align: center; font-weight: 600; margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 6px; display: none; line-height: 1.4; white-space: pre-line; }
    </style>
</head>
<body>

    <h2>Asistencia</h2>
    <form id="asistenciaForm">
        <label>1. SELECCIONÁ TU CURSO</label>
        <select id="curso" disabled required>
            <option value="" disabled selected>Cargando...</option>
            <option value="5° 2° CSH">5° 2° CSH</option>
            <option value="5° 2° EYA">5° 2° EYA</option>
            <option value="6° 2° CSH">6° 2° CSH</option>
            <option value="6° 2° EYA">6° 2° EYA</option>
        </select>

        <label>2. APELLIDO Y NOMBRE</label>
        <select id="estudiante" disabled required>
            <option value="" disabled selected>Cargando...</option>
        </select>
        
        <label>3. ESTADO</label>
        <select id="estado" disabled>
            <option value="Presente">Presente</option>
            <option value="Ausente">Ausente</option>
        </select>
        
        <button type="submit" id="btnEnviar" disabled>Enviar Registro</button>
    </form>
    <div id="status"></div>
</div>

<script>

        ],

        "6° 2° CSH": [

            { nombre: "VIAR", curso: "6° 2° CSH" },
            { nombre: "VATE", curso: "6° 2° CSH" }
        ],
        "6° 2° EYA": [

        ]
    };

    // PARÁMETROS HIVEMQ
    const broker = "d7c00be048ac4f408cd656bbb25ac141.s1.eu.hivemq.cloud"; 
    const usuario = "COLEGIO750";                                     
    const contrasena = "Presente26";                    
    const topico = "colegio/asistencia/unica";             
    const puerto = 8884; 

    const client = new Paho.MQTT.Client(broker, Number(puerto), "web_" + Math.random().toString(16).substr(2, 8));
    const selectCurso = document.getElementById("curso");
    const selectEstudiante = document.getElementById("estudiante");
    const selectEstado = document.getElementById("estado");
    const btn = document.getElementById("btnEnviar");
    const statusDiv = document.getElementById("status");

    function obtenerFechaHoy() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // INICIO AUTOMÁTICO
    window.onload = function() {
        if (localStorage.getItem("asistencia_enviada_dia") === obtenerFechaHoy()) {
            bloquearFormularioPorFraude();
            return;
        }
        validarUbicacionExpress();
    };

    function validarUbicacionExpress() {
        // Petición directa e instantánea al hardware de GPS
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const distancia = calcularDistancia(position.coords.latitude, position.coords.longitude, ESCUELA_LAT, ESCUELA_LON);
                
                if (distancia <= DISTANCIA_MAXIMA_METROS) {
                    // DENTRO DE RANGO: Habilitación limpia y silenciosa
                    selectCurso.disabled = false;
                    selectCurso.options[0].text = "Elegí tu curso...";
                    selectEstado.disabled = false;
                } else {
                    // FUERA DE RANGO: Bloqueo directo
                    selectCurso.options[0].text = "Acceso bloqueado por GPS";
                    selectEstudiante.options[0].text = "Acceso bloqueado por GPS";
                    statusDiv.style.display = "block";
                    statusDiv.style.background = "#fee2e2";
                    statusDiv.style.color = "#dc2626";
                    statusDiv.innerText = "Acceso denegado: No te encontrás en el aula.";
                }
            },
            function(error) {
                selectCurso.options[0].text = "Falta permiso de ubicación";
                statusDiv.style.display = "block";
                statusDiv.style.background = "#fee2e2";
                statusDiv.style.color = "#dc2626";
                statusDiv.innerText = "Error: Activá el GPS para poder ingresar.";
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
        );
    }

    function bloquearFormularioPorFraude() {
        selectCurso.disabled = true;
        selectEstudiante.disabled = true;
        selectEstado.disabled = true;
        btn.disabled = true;
        btn.innerText = "Envío Deshabilitado";
        statusDiv.style.display = "block";
        statusDiv.style.background = "#fee2e2";
        statusDiv.style.color = "#dc2626";
        statusDiv.innerText = "Ya registraste tu asistencia por el día de hoy.";
    }

    selectCurso.onchange = function() {
        const cursoSeleccionado = selectCurso.value;
        const alumnos = baseDatosCursos[cursoSeleccionado] || [];
        selectEstudiante.innerHTML = '<option value="" disabled selected>Seleccioná tu nombre...</option>';
        alumnos.forEach((alumno, indice) => {
            let opt = document.createElement("option");
            opt.value = indice; 
            opt.innerText = alumno.nombre;
            selectEstudiante.appendChild(opt);
        });
        selectEstudiante.disabled = false;
        btn.disabled = false;
    };

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const phi1 = lat1 * Math.PI/180;
        const phi2 = lat2 * Math.PI/180;
        const deltaPhi = (lat2-lat1) * Math.PI/180;
        const deltaLambda = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    document.getElementById("asistenciaForm").onsubmit = function(e) {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "Transmitiendo...";
        conectarYEnviarMQTT();
    };

    function conectarYEnviarMQTT() {
        client.connect({
            userName: usuario,
            password: contrasena,
            useSSL: true,
            timeout: 5,
            onSuccess: onConnect,
            onFailure: function(err) {
                statusDiv.style.display = "block";
                statusDiv.style.background = "#fee2e2";
                statusDiv.style.color = "#dc2626";
                statusDiv.innerText = "Error de red al conectar.";
                btn.disabled = false;
                btn.innerText = "Reintentar";
            }
        });
    }

    function onConnect() {
        const curso = selectCurso.value;
        const indiceAlumno = selectEstudiante.value;
        const alumnoDatos = baseDatosCursos[curso][indiceAlumno];
        
        const nombre = alumnoDatos.nombre;
        const dni = alumnoDatos.dni || "-"; 
        const estado = selectEstado.value;
        const ahora = new Date().toLocaleString();

        const mensajeTexto = `${ahora}|${nombre} (${curso})|${dni}|${estado}`;
        
        const message = new Paho.MQTT.Message(mensajeTexto);
        message.destinationName = topico;
        message.qos = 1;
        
        try {
            client.send(message);
            localStorage.setItem("asistencia_enviada_dia", obtenerFechaHoy());
            document.getElementById("asistenciaForm").reset();
            bloquearFormularioPorFraude();
            statusDiv.innerText = "Asistencia registrada con éxito.";
            statusDiv.style.background = "#ecfdf5";
            statusDiv.style.color = "#059669";
        } catch (error) {
            btn.disabled = false;
            btn.innerText = "Enviar Registro";
        } finally {
            client.disconnect();
        }
    }
</script>

</html>
