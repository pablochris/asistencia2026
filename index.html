    <style>
        :root { --primary: #1a73e8; --bg: #f0f2f5; }

        label { display: block; margin-bottom: 5px; font-size: 12px; color: #64748b; font-weight: 600; }
        select, button { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; background: #f8fafc; }
        select:focus { outline: none; border-color: var(--primary); background: #fff; }
        button { background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 4px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { text-align: center; font-weight: 600; margin-top: 15px; font-size: 14px; color: #475569; padding: 10px; border-radius: 6px; display: none; line-height: 1.4; }

        </select>
        
        <label>3. ESTADO</label>
        <select id="estado">
            <option value="Presente">Presente</option>
            <option value="Ausente">Ausente</option>
        </select>
        
        <button type="submit" id="btnEnviar" disabled>Enviar Registro</button>

</div>

    // 3. DATOS DE TU CONEXIÓN HIVEMQ CLOUD (Completar con tus datos en las comillas)
    const broker = "d7c00be048ac4f408cd656bbb25ac141.s1.eu.hivemq.cloud"; 
    const usuario = "COLEGIO750";

    // =================================================================

    const client = new Paho.MQTT.Client(broker, Number(puerto), "web_" + Math.random().toString(16).substr(2, 8));
    const selectCurso = document.getElementById("curso");
    const selectEstudiante = document.getElementById("estudiante");
    const btn = document.getElementById("btnEnviar");
    const statusDiv = document.getElementById("status");

    // LÓGICA EN CASCADA: Al cambiar el curso, se actualizan los estudiantes
    selectCurso.onchange = function() {
        const cursoSeleccionado = selectCurso.value;
        const alumnos = baseDatosCursos[cursoSeleccionado] || [];
        
        selectEstudiante.innerHTML = '<option value="" disabled selected>Seleccioná tu nombre...</option>';
        
        alumnos.forEach((alumno, indice) => {
            let opt = document.createElement("option");
            opt.value = indice; 
            opt.innerText = alumno.nombre;
            selectEstudiante.appendChild(opt);
        });
        
        selectEstudiante.disabled = false;
        btn.disabled = false;
    };

    // Fórmula matemática Haversine para calcular distancia real entre dos coordenadas
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Radio de la Tierra en metros
        const phi1 = lat1 * Math.PI/180;
        const phi2 = lat2 * Math.PI/180;
        const deltaPhi = (lat2-lat1) * Math.PI/180;
        const deltaLambda = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    document.getElementById("asistenciaForm").onsubmit = function(e) {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "Validando...";
        statusDiv.style.display = "block";
        statusDiv.style.background = "#fef3c7";
        statusDiv.style.color = "#d97706";
        statusDiv.innerText = "Comprobando asistencia presencial (Ubicación por red)...";

        // Solicitar ubicación express (sin encender antenas satelitales pesadas)
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const latAlumno = position.coords.latitude;
                const lonAlumno = position.coords.longitude;
                
                // Medir distancia a la escuela
                const distancia = calcularDistancia(latAlumno, lonAlumno, ESCUELA_LAT, ESCUELA_LON);
                
                if (distancia <= DISTANCIA_MAXIMA_METROS) {
                    statusDiv.innerText = "Ubicación confirmada. Transmitiendo datos...";
                    conectarYEnviarMQTT();
                } else {
                    // Bloqueo: El alumno está lejos de la institución
                    statusDiv.style.background = "#fee2e2";
                    statusDiv.style.color = "#dc2626";
                    statusDiv.innerText = `Acceso denegado: Debes estar en el establecimiento escolar. (Detectado a ${Math.round(distancia/1000)} km).`;
                    btn.disabled = false;
                    btn.innerText = "Reintentar Envío";
                }
            },
            function(error) {
                // Bloqueo: Ubicación apagada o permisos denegados
                statusDiv.style.background = "#fee2e2";
                statusDiv.style.color = "#dc2626";
                statusDiv.innerText = "Error obligatorio: Activa los servicios de ubicación en tu celular para dar el presente.";
                btn.disabled = false;
                btn.innerText = "Reintentar Envío";
            },
            { 
                enableHighAccuracy: false, // OPTIMIZADO: Usa celdas de red/Wi-Fi cercanas (Instantáneo)
                timeout: 5000,             // Margen de espera máximo de 5 segundos
                maximumAge: 60000          // Acepta caché de ubicación de hasta 1 minuto
            }
        );
    };

    function conectarYEnviarMQTT() {
        client.connect({
            userName: usuario,
            password: contrasena,
            useSSL: true,
            timeout: 7,
            onSuccess: onConnect,
            onFailure: function(err) {
                statusDiv.style.background = "#fee2e2";
                statusDiv.style.color = "#dc2626";
                statusDiv.innerText = "Error: " + (err.errorMessage || "Fallo de red al conectar al bróker.");
                btn.disabled = false;
                btn.innerText = "Reintentar";
            }
        });
    }

    function onConnect() {
        const curso = selectCurso.value;
        const indiceAlumno = selectEstudiante.value;
        const alumnoDatos = baseDatosCursos[curso][indiceAlumno];
        
        const nombre = alumnoDatos.nombre;
        const dni = alumnoDatos.dni || "-"; // Envía guion si no tiene DNI cargado en la lista
        const estado = document.getElementById("estado").value;
        const ahora = new Date().toLocaleString();

        const mensajeTexto = `${ahora}|${nombre} (${curso})|${dni}|${estado}`;
        
        const message = new Paho.MQTT.Message(mensajeTexto);
        message.destinationName = topico;
        message.qos = 1;
        
        try {
            client.send(message);
            statusDiv.style.background = "#ecfdf5";
            statusDiv.style.color = "#059669";
            statusDiv.innerText = "¡Asistencia registrada con éxito en la escuela!";
            document.getElementById("asistenciaForm").reset();
            selectEstudiante.disabled = true;
            selectEstudiante.innerHTML = '<option value="" disabled selected>Primero elegí el curso...</option>';
        } catch (error) {
            statusDiv.innerText = "Error al despachar el paquete.";
            statusDiv.style.color = "#dc2626";
        } finally {
            btn.disabled = true;
            btn.innerText = "Enviar Registro";
            client.disconnect();
        }
    }
