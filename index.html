<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Dinámica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 340px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1e293b; margin: 0 0 20px 0; font-weight: 700; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #64748b; font-weight: 600; }
        select, button { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; background: #f8fafc; }
        select:focus { outline: none; border-color: var(--primary); background: #fff; }
        button { background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 4px; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #status { text-align: center; font-weight: 600; margin-top: 15px; font-size: 14px; color: #475569; padding: 8px; border-radius: 6px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Asistencia</h2>
    <form id="asistenciaForm">
        <label>1. SELECCIONÁ TU CURSO</label>
        <select id="curso" required>
            <option value="" disabled selected>Elegí tu curso...</option>
            <option value="5° 2° CSH">5° 2° CSH</option>
            <option value="5° 2° EYA">5° 2° EYA</option>
            <option value="6° 2° CSH">6° 2° CSH</option>
            <option value="6° 2° EYA">6° 2° EYA</option>
        </select>

        <label>2. APELLIDO Y NOMBRE</label>
        <select id="estudiante" disabled required>
            <option value="" disabled selected>Primero elegí el curso...</option>
        </select>
        
        <label>3. ESTADO</label>
        <select id="estado">
            <option value="Presente">Presente</option>
            <option value="Ausente">Ausente</option>
        </select>
        
        <button type="submit" id="btnEnviar" disabled>Enviar Registro</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // =================================================================
    // REEMPLAZÁ ACÁ LAS LISTAS DE ALUMNOS CON TUS CURSOS REALES:
    // =================================================================
    const baseDatosCursos = {
        "5° 2 CSH°": [
            { nombre: "ACOSTA PRADO, MAIA CANDELA", curso: "5° 2° CSH"},
            { nombre: "BARRAZA AVILES, LUZ MIA MARTINA", curso: "5° 2° CSH"}
            { nombre: "CALFUPAN D'ASTOLFO, SEBASTIAN", curso: "5° 2° CSH"}
            { nombre: "CAMPOS MONTAÑO, MILAGROS NAHIARA", curso: "5° 2° CSH"}
            { nombre: "CECCATTO, FRANCESCO", curso: "5° 2° CSH"}
            { nombre: "CLAROS, ANAHI SOLEDAD", curso: "5° 2° CSH"}
            { nombre: "COBA, NANCY BELÉN ELIZABETH", curso: "5° 2° CSH"}
            { nombre: "DELGADO, SANTIAGO AXEL AGUSTIN", curso: "5° 2° CSH"}
            { nombre: "GALECH, ADRIANO JEAN LUC", curso: "5° 2° CSH"}
            { nombre: "GARCIA, XIMENA XIOMARA", curso: "5° 2° CSH"}
            { nombre: "GELABERT HOFSETZ, JULIETA ALEJANDRA", curso: "5° 2° CSH"}
            { nombre: "GIMENEZ, FIORELLA JENNIFER", curso: "5° 2° CSH"}
            { nombre: "GITALI, IAN LIONEL", curso: "5° 2° CSH"}
            { nombre: "JUAREZ, ALMA LUDMILA", curso: "5° 2° CSH"}
            { nombre: "MARCIAL, ISAÍAS LEONEL", curso: "5° 2° CSH"}
            { nombre: "NAVARRO BALDOVINO, BIANCA MARIA LUZ", curso: "5° 2° CSH"}
            { nombre: "OLGUERA CAMPOS, EIMI", curso: "5° 2° CSH"}
            { nombre: "PERALTA LÓPEZ, JOAQUIN ALBERTO", curso: "5° 2° CSH"}
            { nombre: "RIOS MALDONADO, ROSANA MARLENE", curso: "5° 2° CSH"}
            { nombre: "SANABRIA LEGUIZAMON, ROCIO JAZMIN", curso: "5° 2° CSH"}
            { nombre: "TREDJEU CUAL, MARTINA JAZMÍN", curso: "5° 2° CSH"}
            { nombre: "VALENZUELA, PAMELA ABIGAIL", curso: "5° 2° CSH"}
        ],	
        "5° 2° EYA": [
            { nombre: "Ramírez Rigoberto", dni: "23498784" },
            { nombre: "Rey Patricio", dni: "24897984" }
        ],
        "6° 2° CSH": [
            { nombre: "Fernández Luis", dni: "33445566" }
        ],
        "6° 2° EYA": [
            { nombre: "López Ana", dni: "44556677" }
        ]
    };

    // DATOS DE TU CONEXIÓN HIVEMQ CLOUD (Mantenelos igual)
    const broker = "d7c00be048ac4f408cd656bbb25ac141.s1.eu.hivemq.cloud"; 
    const usuario = "COLEGIO750";                             
    const contrasena = "Presente26";                   
    const topico = "colegio/asistencia/unica";             
    const puerto = 8884; 
    // =================================================================

    const client = new Paho.MQTT.Client(broker, Number(puerto), "web_" + Math.random().toString(16).substr(2, 8));
    const selectCurso = document.getElementById("curso");
    const selectEstudiante = document.getElementById("estudiante");
    const btn = document.getElementById("btnEnviar");
    const statusDiv = document.getElementById("status");

    // LÓGICA EN CASCADA: Al cambiar el curso, se actualizan los estudiantes
    selectCurso.onchange = function() {
        const cursoSeleccionado = selectCurso.value;
        const alumnos = baseDatosCursos[cursoSeleccionado] || [];
        
        // Limpiar el selector de estudiantes
        selectEstudiante.innerHTML = '<option value="" disabled selected>Seleccioná tu nombre...</option>';
        
        // Cargar los alumnos del curso elegido
        alumnos.forEach((alumno, indice) => {
            let opt = document.createElement("option");
            opt.value = indice; // Guardamos el índice para buscar el DNI después
            opt.innerText = alumno.nombre;
            selectEstudiante.appendChild(opt);
        });
        
        // Activar el selector de estudiantes y el botón
        selectEstudiante.disabled = false;
        btn.disabled = false;
    };

    document.getElementById("asistenciaForm").onsubmit = function(e) {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "Conectando...";
        statusDiv.style.display = "block";
        statusDiv.innerText = "Conectando al servidor veloz...";

        client.connect({
            userName: usuario,
            password: contrasena,
            useSSL: true,
            timeout: 7,
            onSuccess: onConnect,
            onFailure: function(err) {
                statusDiv.innerText = "Error: " + (err.errorMessage || "Fallo de red.");
                statusDiv.style.color = "#dc2626";
                btn.disabled = false;
                btn.innerText = "Reintentar";
            }
        });
    };

    function onConnect() {
        statusDiv.innerText = "Transmitiendo datos...";
        
        const curso = selectCurso.value;
        const indiceAlumno = selectEstudiante.value;
        
        // Buscamos los datos reales del alumno usando el índice seleccionado
        const alumnoDatos = baseDatosCursos[curso][indiceAlumno];
        const nombre = alumnoDatos.nombre;
        const dni = alumnoDatos.dni;
        
        const estado = document.getElementById("estado").value;
        const ahora = new Date().toLocaleString();

        // Agregamos el curso al paquete de envío para mantener la prolijidad
        const mensajeTexto = `${ahora}|${nombre} (${curso})|${dni}|${estado}`;
        
        const message = new Paho.MQTT.Message(mensajeTexto);
        message.destinationName = topico;
        message.qos = 1;
        
        try {
            client.send(message);
            statusDiv.innerText = "¡Asistencia enviada con éxito!";
            statusDiv.style.color = "#059669";
            document.getElementById("asistenciaForm").reset();
            selectEstudiante.disabled = true;
            selectEstudiante.innerHTML = '<option value="" disabled selected>Primero elegí el curso...</option>';
        } catch (error) {
            statusDiv.innerText = "Error al despachar el paquete.";
            statusDiv.style.color = "#dc2626";
        } finally {
            btn.disabled = true;
            btn.innerText = "Enviar Registro";
            client.disconnect();
        }
    }
</script>
</body>
</html>
